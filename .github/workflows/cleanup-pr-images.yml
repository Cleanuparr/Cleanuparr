name: Cleanup PR Images

on:
  # A fork pull_request run gets a read-only token. The delete then fails with 403.
  # pull_request_target gives a write token. This workflow checks out no code.
  # It reads only the PR number. Therefore pull_request_target is safe here.
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the PR image tag
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: cleanuparr
          # Do not leave this value empty. An empty filter matches every tag.
          # The action then deletes latest and all version tags. pr-none matches nothing.
          image-tags: ${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || 'pr-none' }}
          # Do not use "both" here. The action ignores image-tags for untagged versions.
          # The run then deletes every untagged version in the package. This can remove
          # the platform digests of another build before its manifest index exists.
          tag-selection: tagged
          cut-off: 1s
          dry-run: false

  sweep-orphans:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete orphaned untagged digests
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: cleanuparr
          # The action ignores image-tags for untagged versions. This job sets no tags.
          tag-selection: untagged
          # This cut-off is longer than any build. The job never deletes a digest that
          # still waits for its manifest index.
          cut-off: 24h
          dry-run: false
