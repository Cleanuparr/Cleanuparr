name: E2E Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA). Defaults to the triggering ref.'
        type: string
        required: false
        default: ''
  workflow_dispatch:

concurrency:
  group: E2E Tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.suites.outputs.list }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Build the suite matrix
        id: suites
        working-directory: e2e
        run: echo "list=$(bash ./scripts/ci-matrix.sh)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}

    name: e2e (${{ matrix.suite.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Get vault secrets
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_HOST }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets:
            secrets/data/github packages_pat | PACKAGES_PAT

      - name: Start services
        working-directory: e2e
        run: make ${{ matrix.suite.make-target }}
        env:
          PACKAGES_USERNAME: ${{ github.repository_owner }}
          PACKAGES_PAT: ${{ env.PACKAGES_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Report runner disk space
        run: df -h /

      - name: Install Playwright browsers
        working-directory: e2e
        timeout-minutes: 10
        env:
          DEBUG: pw:install
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test ${{ matrix.suite.projects }}

      - name: Dump service logs
        if: failure()
        working-directory: e2e
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail 500

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results-${{ matrix.suite.name }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        working-directory: e2e
        run: make down
