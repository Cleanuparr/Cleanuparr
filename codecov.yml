coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      backend:
        flags:
          - backend
        target: auto
        threshold: 1%
      frontend:
        flags:
          - frontend
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto

flags:
  backend:
    paths:
      - code/backend/
    carryforward: true
  frontend:
    paths:
      - code/frontend/
    carryforward: true

ignore:
  - "**/Migrations/**"
  - "code/backend/Cleanuparr.Infrastructure.QBittorrent/Rss*.cs"
  - "code/backend/Cleanuparr.Infrastructure.QBittorrent/Search*.cs"
  - "code/backend/Cleanuparr.Infrastructure.QBittorrent/Internal/RssParser.cs"
  - "code/backend/Cleanuparr.Infrastructure.QBittorrent/Internal/Api1UrlProvider.cs"
  - "code/backend/Cleanuparr.Infrastructure.QBittorrent/Internal/Api1RequestProvider.cs"
