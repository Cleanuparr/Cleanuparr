<app-card header="Change Password">
  <div class="form-stack">
    @if (oidcExclusiveMode()) {
      <div class="section-notice">
        Password login is disabled while OIDC exclusive mode is active.
      </div>
    }
    <app-input
      label="Current Password"
      type="password"
      placeholder="Enter current password"
      [formField]="passwordForm.currentPassword"
      [error]="passwordForm.currentPassword().touched() ? passwordForm.currentPassword().errors()[0]?.message : undefined"
    />
    <app-input
      label="New Password"
      type="password"
      placeholder="Enter new password (min 8 characters)"
      [formField]="passwordForm.newPassword"
      [error]="passwordForm.newPassword().touched() ? passwordForm.newPassword().errors()[0]?.message : undefined"
    />

    @if (passwordForm.newPassword().value()) {
      <div class="password-strength">
        <div class="password-strength__bar">
          <div class="password-strength__fill password-strength__fill--{{ newPasswordStrength() }}"></div>
        </div>
        <span class="password-strength__label password-strength__label--{{ newPasswordStrength() }}">{{ newPasswordStrength() }}</span>
      </div>
    }

    <app-input
      label="Confirm New Password"
      type="password"
      placeholder="Confirm new password"
      [formField]="passwordForm.confirmPassword"
      [error]="passwordForm.confirmPassword().touched() ? passwordForm.confirmPassword().errors()[0]?.message : undefined"
    />
    <div class="form-actions">
      <app-button
        variant="primary"
        [glowing]="!passwordForm().invalid() && !oidcExclusiveMode()"
        [disabled]="passwordForm().invalid() || changingPassword() || oidcExclusiveMode()"
        (clicked)="changePassword()"
      >
        @if (changingPassword()) {
          <app-spinner size="sm" /> Changing...
        } @else {
          Change Password
        }
      </app-button>
    </div>
  </div>
</app-card>
